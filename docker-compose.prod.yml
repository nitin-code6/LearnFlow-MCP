version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: learnflow
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - lms-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=super-secret-production-key
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/learnflow?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lms-prod-network
    # Internal routing only; no exposed ports needed because Nginx proxies it

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lms-prod-network

volumes:
  postgres_prod_data:

networks:
  lms-prod-network:
    driver: bridge
